services:
  postgres:
    image: postgres:16-alpine
    container_name: barbearia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbearia_scaquetti}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbearia_scaquetti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: barbearia-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required. Copy .env.example to .env for local Docker.}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required. Copy .env.example to .env for local Docker.}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4173}
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001/v1
    container_name: barbearia-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/v1
    ports:
      - "4173:4173"

volumes:
  postgres_data:
